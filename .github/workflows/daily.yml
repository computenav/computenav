# ComputeNAV daily update + GitHub Pages deploy.
#
# Schedule: 12:30 UTC daily = 04:30 PST (Nov–Mar) / 05:30 PDT (Mar–Nov).
#   Runs before the 07:00 PT health check; GitHub may start scheduled jobs late
#   (often 5–30 min, occasionally more). The index date (asof_date_pt) is the PT
#   calendar date at run time, so an early-morning PT run stamps "today".
#
# Privacy / licensing:
#   * All private artifacts (nav.db, snapshots/, logs/, dashboard_data.json with
#     listing-level observations) are written to $RUNNER_TEMP and discarded when
#     the job ends. They are NOT committed, NOT uploaded as artifacts and NOT
#     cached (caches/artifacts of a public repo are readable by others).
#   * Licence-restricted sources are skipped entirely (COMPUTENAV_SKIP_SOURCES).
#   * Only docs/data/latest.json and docs/data/history.json (aggregates) and
#     docs/data/news.json (third-party headline links, no article text) are
#     committed back and published. export_public.py refuses to publish if a
#     restricted source contributed observations.
#   * News headlines are fetched best-effort from public RSS/Atom feeds; a
#     failed fetch does not fail the job and leaves the last news.json in place.
#   * History continuity: docs/data/history.json in the repo is the long-term
#     record; each run upserts today's point into it. nav.db is rebuilt fresh
#     every run and is not needed for history.
name: daily

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "!docs/data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: computenav-daily
  cancel-in-progress: false

env:
  COMPUTENAV_SKIP_SOURCES: vast_public_feed,vast_bundles,ebay_sold,ebay_active,ebay_sold_mi300x,ebay_active_mi300x
  TZ: America/Los_Angeles

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Competitor denylist check (before compute)
        run: python pipeline/check_sources.py

      - name: Guard tests (offline)
        run: python -m unittest pipeline/test_guards.py

      - name: Run daily pipeline (private data stays in RUNNER_TEMP)
        if: github.event_name != 'push'
        env:
          COMPUTENAV_DATA_DIR: ${{ runner.temp }}/computenav-private
        # Actions logs of a public repo are public. run_daily.py logs every leg
        # value (including legs hidden by the n<3 rule), so its full log stays
        # in RUNNER_TEMP; only WARNING/ERROR lines are echoed, with decimal
        # numbers masked.
        run: |
          mkdir -p "$RUNNER_TEMP/computenav-log"
          set +e
          python pipeline/run_daily.py > "$RUNNER_TEMP/computenav-log/run_daily.log" 2>&1
          rc=$?
          set -e
          grep -E " (WARNING|ERROR|CRITICAL) |Traceback|Error:" "$RUNNER_TEMP/computenav-log/run_daily.log" \
            | sed -E 's/[0-9][0-9,]*\.[0-9]+/<num>/g' || true
          echo "run_daily.py exit code: $rc ($(wc -l < "$RUNNER_TEMP/computenav-log/run_daily.log") log lines kept private)"
          exit $rc

      - name: Export public aggregated JSON
        if: github.event_name != 'push'
        run: >
          python pipeline/export_public.py
          --private-latest "${{ runner.temp }}/computenav-private/output/latest.json"
          --public-dir docs/data

      - name: Render methodology page
        run: python pipeline/render_methodology.py

      - name: Fetch GPU news headlines (best-effort)
        # A failed or empty fetch must not fail the job; keep the last news.json.
        continue-on-error: true
        run: python scripts/fetch_news.py --output docs/data/news.json || true

      - name: Check public files (USD only, English only, no hidden n<3 values)
        env:
          PRIV_LATEST: ${{ runner.temp }}/computenav-private/output/latest.json
        run: |
          if [ -f "$PRIV_LATEST" ]; then
            python pipeline/check_public.py --private-latest "$PRIV_LATEST"
          else
            python pipeline/check_public.py
          fi

      - name: Verify nothing private is in the site folder
        run: |
          set -e
          if find docs \( -name '*.db' -o -name '*.bin' -o -name 'dashboard_data.json' -o -name 'raw_quotes_*' -o -name 'event_windows_*' -o -name '*.csv' \) | grep -q .; then
            echo "private file found under docs/"; exit 1
          fi
          python -c "import json, pathlib; fs=['docs/data/latest.json','docs/data/history.json'] + (['docs/data/news.json'] if pathlib.Path('docs/data/news.json').exists() else []); [json.load(open(f)) for f in fs]"

      - name: Commit updated public JSON
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.json docs/data/news.json docs/methodology.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: daily update $(date +%Y-%m-%d) PT"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
